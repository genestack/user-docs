# The site is served under /user-docs, the path the Ingress passes on as it is.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    absolute_redirect off;
    server_tokens off;

    # The security headers on every response, error pages included. No location adds headers
    # of its own, which would drop these there.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    location = /user-docs {
        return 302 /user-docs/;
    }

    location /user-docs/ {
        alias   /usr/share/nginx/html/;
        index   index.html;
        # Every response is revalidated, so a release shows its pages at once
        expires -1;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
