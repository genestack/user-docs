exclude_docs: |
    docs/**/*.md

plugins:
    - search
    - privacy
theme:
    name: material
    palette:
      - scheme: default
        primary: custom
        accent: custom
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode
      - scheme: slate
        primary: custom
        accent: custom
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
    logo: assets/ODM-mono-white.png
    favicon: assets/favicon.ico
    font: false
    features:
        - content.code.annotate
        - content.code.copy
        # - content.code.select
        # - content.tabs.link
        - content.tooltips
        # - navigation.expand
        - navigation.footer
        - navigation.indexes
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.instant.progress
        - navigation.path
        # navigation.prune disabled: render the full section tree so any section
        # can be expanded/collapsed, not just the current page's branch.
        # - navigation.prune
        # navigation.sections disabled: render sections as collapsible tree
        # items (chevron toggle) rather than fixed, always-open groups.
        # - navigation.sections
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.top
        - navigation.tracking
        - search.highlight
        - search.share
        - search.suggest
        - toc.follow
extra:
    version:
        provider: mike
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/genestack
          name: Genestack on GitHub
        - icon: fontawesome/brands/youtube
          link: https://www.youtube.com/@GenestackLtd
          name: Genestack on YouTube
        - icon: fontawesome/brands/facebook
          link: http://facebook.com/genestackltd/
          name: Genestack on Facebook
        - icon: fontawesome/brands/x-twitter
          link: https://x.com/genestack
          name: Genestack on X
        - icon: fontawesome/brands/linkedin
          link: https://www.linkedin.com/company/genestack
          name: Genestack on LinkedIn
        - icon: fontawesome/solid/globe
          link: https://genestack.com/
          name: Genestack website
extra_css:
    - stylesheets/extra.css
markdown_extensions:
    - admonition
    - pymdownx.details
    - attr_list
    - md_in_html
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.tabbed:
          alternate_style: true
    - tables
    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
    - footnotes
    - pymdownx.critic
    - pymdownx.caret
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.tilde
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - def_list
    - pymdownx.tasklist:
        custom_checkbox: true
    - toc:
        permalink: true
